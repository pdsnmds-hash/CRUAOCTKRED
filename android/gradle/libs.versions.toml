#
# Single source of truth for every dependency version in the platform.
#
# Before this file each module carried its own literal coordinates, and they drifted:
# the platform modules were on compose-bom 2026.06.00 / firebase-bom 34.18.0 while
# KredPol's :app was still on 2025.05.00 / 33.12.0. A module and the app that hosts it
# were resolving different Compose runtimes.
#
# Rule: no module declares a version literal. Add the coordinate here, reference it as
# libs.<alias>. Dashes in an alias become dots in the accessor (coil-compose -> libs.coil.compose).
#

[versions]
# Build tooling
agp = "9.4.1"
kotlin = "2.4.21"
googleServices = "4.5.0"
crashlytics = "3.0.8"

# SDK levels — kept here so a bump is one edit. Modules read them as
# libs.versions.compileSdk.get().toInt().
compileSdk = "37"
minSdk = "24"
targetSdk = "36"

# Platform BOMs
composeBom = "2026.09.00"
firebaseBom = "35.0.2"

# Libraries
activityCompose = "1.13.0"
appcompat = "1.8.0"
appsflyer = "7.0.1"
coil = "3.6.3"
coreKtx = "1.19.1"
coroutines = "1.11.0"
datastore = "1.2.1"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"

# Test + screenshot harness
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.49.0"

[libraries]
# Compose — versions come from the BOM, so these carry no version of their own
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

# Firebase — versions come from the BOM
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-common = { group = "com.google.firebase", name = "firebase-common" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# AndroidX
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Third party
appsflyer = { group = "com.appsflyer", name = "af-android-sdk", version.ref = "appsflyer" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
# Products MUST include the network fetcher as well, or AsyncImage silently loads nothing.
# See AGENTS.md section 3.3.
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Test + screenshots
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
